<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TALIARE SEMIJOIAS - Sistema Interno</title>
    <meta name="description" content="Sistema interno de gestão para TALIARE SEMIJOIAS" />
    <meta name="author" content="TALIARE" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8B1538" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TALIARE" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons - Cache busting para forçar atualização -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png?v=2" />
    
    <!-- Google Fonts - Zalando Sans Expanded (oficial Taliare) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@300;400;500;600&family=Zalando+Sans+Expanded:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <meta property="og:title" content="TALIARE SEMIJOIAS - Sistema Interno" />
    <meta property="og:description" content="Sistema interno de gestão para TALIARE SEMIJOIAS" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://taliare.com.br/icons/icon-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://taliare.com.br/icons/icon-512x512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
